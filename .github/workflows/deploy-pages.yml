name: Publicar en GitHub Pages

# Publica el contenido de webapp/ (la app ya generada) en GitHub Pages
# cada vez que hay un push a main. No necesita build: los archivos ya
# están listos en el repositorio.
#
# Requiere un paso único de configuración en GitHub, una sola vez:
# Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deployment
        uses: actions/deploy-pages@v4
